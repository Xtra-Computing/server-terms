site_name: Xtra Computing Server Docs
site_description: Terms of use and user guides for the Xtra Computing Server
site_url: https://xtra-computing.github.io/server-terms/
repo_url: https://github.com/Xtra-Computing/server-terms
repo_name: server-terms
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Xtra Computing Group

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: {icon: material/brightness-4, name: Switch to light mode}

extra_css:
  - stylesheets/extra.css


hooks:
  - hooks.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Terms: 条款
            Terms of Use: 使用条款
            Admin Liability: 管理员责任边界
            Getting Started: 新人指南
            Overview: 概览
            Containers: 容器
            Rootless Docker (deprecated): Rootless Docker（已停用）
            Network: 网络
            Disk: 磁盘
            News: 服务器通知
            Archive: 通知归档
            "2026-10-06 — xtrah100 maintenance": "2026-10-06 — xtrah100 维护"
            "2026-09-22 — Docker migration": "2026-09-22 — Docker 迁移"
            "2026-09-12 — xtrah100 storage cleanup": "2026-09-12 — xtrah100 磁盘空间清理"
            "2026-09-10 — xtrah200 reboot at 14:00: two GPUs with firmware faults": "2026-09-10 — xtrah200 14:00 重启：两块 GPU 固件故障"
            "2026-09-03 — xtra3090 reboot at 17:30: GPU 1 disconnected from PCIe": "2026-09-03 — xtra3090 17:30 重启：GPU 1 从 PCIe 总线掉线"
            "2026-08-12 — xtrah200 reboot at 13:30: all four GPUs with firmware faults": "2026-08-12 — xtrah200 13:30 重启：四块 GPU 固件故障"
            "2026-08-11 — xtrah200 reboot at 14:45: GPU0 failure": "2026-08-11 — xtrah200 14:45 重启：GPU0 故障"
            "2026-07-31 — xtrah200 offline around 00:20 due to OOM": "2026-07-31 — xtrah200 因 OOM 于 00:20 左右离线"
            "2026-05-22 — xtrah200 restart at 14:00: GPU driver version mismatch": "2026-05-22 — xtrah200 14:00 重启：GPU 驱动版本不匹配"

  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started.md
      - Containers:
          - Apptainer: apptainer.md
          - Rootless Docker (deprecated): docker.md
      - Network: network.md
      - Disk: disk.md
  - News:
      - Archive: news/index.md
      - "2026-10-06 — xtrah100 maintenance": news/2026-10-06-xtrah100-maintenance.md
      - "2026-09-22 — Docker migration": news/2026-09-22-docker-deprecation-apptainer-migration.md
      - "2026-09-12 — xtrah100 storage cleanup": news/2026-09-12-xtrah100-storage-cleanup.md
      - "2026-09-10 — xtrah200 reboot at 14:00: two GPUs with firmware faults": news/2026-09-10-xtrah200-firmware-fault-reboot.md
      - "2026-09-03 — xtra3090 reboot at 17:30: GPU 1 disconnected from PCIe": news/2026-09-03-xtra3090-pcie-fault-reboot.md
      - "2026-08-12 — xtrah200 reboot at 13:30: all four GPUs with firmware faults": news/2026-08-12-xtrah200-firmware-fault-reboot.md
      - "2026-08-11 — xtrah200 reboot at 14:45: GPU0 failure": news/2026-08-11-xtrah200-gpu0-failure-reboot.md
      - "2026-07-31 — xtrah200 offline around 00:20 due to OOM": news/2026-07-31-xtrah200-oom-outage.md
      - "2026-05-22 — xtrah200 restart at 14:00: GPU driver version mismatch": news/2026-05-22-xtrah200-driver-mismatch-reboot.md
  - Methodology: methodology.md
  - Terms:
      - Terms of Use: terms.md
      - Admin Liability: admin-liability.md

extra:
  generator: false  # hide "Made with Material for MkDocs"

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # keep unicode so Chinese anchors like #账号管理 match GitHub's slugs
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
